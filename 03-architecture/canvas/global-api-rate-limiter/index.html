<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Global API Rate Limiter · Ron's Growth</title><link rel="stylesheet" href="/growth-site/_astro/Base.BKz5aqPE.css"></head><body><header class="site-header"><a class="brand" href="/growth-site/">Ron's Growth</a><nav><a href="/growth-site/03-architecture/">架構層</a><a href="/growth-site/canvas/">白板</a></nav></header><main class="wide"><div class="canvas-bar"><span><a href="/growth-site/03-architecture/">架構層</a> / <strong>Global API Rate Limiter</strong></span><span class="hint">拖曳、滾輪或雙指捲動平移 · Ctrl／⌘＋滾輪或雙指開合縮放 · Shift＋1 看整張白板 · 點卡片在側邊欄閱讀</span></div><div class="canvas-stage"><div id="canvas" class="canvas-host"></div><aside id="reader" class="reader" aria-labelledby="reader-title" hidden><header class="reader-head"><h2 id="reader-title" class="reader-title"></h2><button type="button" class="reader-close" aria-label="關閉">✕</button></header><div class="reader-body prose"></div><p class="reader-more"><a>開啟完整文章頁 →</a></p></aside></div><script type="application/json" id="canvas-data">{"nodes":[{"id":"39b2c569-982f-410b-a0b6-8305eb92595c","type":"group","x":160,"y":160,"width":1640,"height":1865,"color":"#4a90e2","label":"需求釐清與設計入口"},{"id":"dc2de347-3694-4520-b395-05640679fb50","type":"group","x":2860,"y":850,"width":1470,"height":1439,"color":"#9c6ade","label":"單區判定：Redis Token Bucket"},{"id":"31d45ae0-4ad3-4823-9d69-616c5b3acd79","type":"group","x":860,"y":2225,"width":1640,"height":991,"color":"#4a90e2","label":"演算法對照：burst／平滑／連續時間窗"},{"id":"ce4722be-7f82-4879-823e-07d47c014a1c","type":"group","x":2860,"y":2460,"width":1470,"height":921,"color":"#4caf50","label":"全域"},{"id":"b44f34f8-8455-4404-95ce-0b7a8b6ad05a","type":"text","x":3770,"y":2500,"width":520,"height":841,"text":"\u003ch3 class=\"card-title\">Failure Handling 與 Observability\u003c/h3>\u003cp>\u003cstrong>Failure policy 依 endpoint 風險選擇\u003c/strong>：Redis、config service 或 quota control plane 失敗時，高風險、付費或易 abuse 的 endpoint 採 fail closed；低風險讀取可短暫 fail open；也可退回保守的 local static limit。Redis 呼叫設 5–10ms timeout 加 circuit breaker：滑動時間窗內錯誤率超過門檻就切到本地 1/N 額度，half-open 時放少量請求探測恢復。\u003c/p>\n\u003cp>\u003cstrong>Client contract 必須避免 retry storm\u003c/strong>：超限回 \u003ccode>429\u003c/code>，附 \u003ccode>Retry-After\u003c/code>、remaining quota、limit 與 reset time，讓 client 使用 backoff 加 jitter。\u003c/p>\n\u003cp>\u003cstrong>觀測同時證明保護與公平\u003c/strong>：量測 allow／reject rate、decision latency、error rate、bucket remaining、quota lease、over-admission、config propagation、top rejected clients 與熱點 endpoint。每個 global 誤差都要可量化與可觀測。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#failure-handling-與-observability\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"d923ec79-bb9a-4414-8a2f-4b0b56870bbd","type":"text","x":3770,"y":1170,"width":520,"height":800,"text":"\u003ch3 class=\"card-title\">多維度 Key 與熱點\u003c/h3>\u003cp>\u003cstrong>每個維度一個 bucket，全部通過才放行\u003c/strong>：API、商戶、domain、region 各有自己的 key，例如 \u003ccode>rl:{merchant:m42}:api:POST/orders\u003c/code>。在同一個 Lua script 裡先檢查所有 bucket、再一起扣除，避免某個維度已扣、另一個維度卻拒絕。\u003c/p>\n\u003cp>\u003cstrong>Redis Cluster 的 slot 限制\u003c/strong>：一個 Lua script 只能操作同一個 slot 的 key。用 hash tag \u003ccode>{merchant:m42}\u003c/code> 讓同一商戶的各維度落在同一個 slot；domain、region 這類共用 key 分開呼叫，或改用本地近似計數。\u003c/p>\n\u003cp>\u003cstrong>熱點 key 的處理\u003c/strong>：大商戶或全域 region 的 key 會集中打到同一個 shard。常見做法是 local token lease（一次向 Redis 預取一批 token 在本地扣）、把 key 拆成 N 個子 bucket 各分 1/N 額度，或對共用維度改用本地近似限流再定期同步。代價是可能短暫超限，誤差必須可觀測。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#多維度-key-與熱點\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"16c943ec-35ea-4013-bb05-763c69da7147","type":"text","x":1240,"y":200,"width":520,"height":663,"text":"\u003ch3 class=\"card-title\">設計入口與需求邊界\u003c/h3>\u003cp>\u003cstrong>先分清三件事\u003c/strong>：需求問題用來確認必要的限制與行為；設計假設是在資訊不足時明示暫定前提；設計選擇才是依需求決定 key、演算法、儲存與跨區協調。不要直接假設以 IP 限流，也不要先挑演算法。\u003c/p>\n\u003cp>需求問答有三個並列面向，不是執行步驟：\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E9%99%90%E6%B5%81%E5%A5%91%E7%B4%84%E9%99%90%E5%88%B6%E8%AA%B0%E8%B6%85%E9%99%90%E6%80%8E%E9%BA%BC%E8%BE%A6\">限流契約：限制誰，超限怎麼辦？\u003c/a>、\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E6%B5%81%E9%87%8F%E8%AA%9E%E6%84%8F%E5%85%81%E8%A8%B1-burst%E9%82%84%E6%98%AF%E5%9A%B4%E6%A0%BC%E6%99%82%E9%96%93%E7%AA%97\">流量語意：允許 burst，還是嚴格時間窗？\u003c/a>、\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E5%85%A8%E5%9F%9F%E8%AA%9E%E6%84%8F%E8%B7%A8%E5%8D%80%E5%85%B1%E4%BA%AB%E5%A4%9A%E5%B0%91%E9%A1%8D%E5%BA%A6%E8%A6%8F%E5%89%87%E5%A4%9A%E4%B9%85%E7%94%9F%E6%95%88\">全域語意：跨區共享多少額度，規則多久生效？\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>責任邊界\u003c/strong>：DNS、Global Load Balancer 或 routing layer 決定 client 前往哪個 region；Rate Limiter 依規則判定請求是否可進入，保護可用性、公平性與下游容量。\u003c/p>\n\u003cp>\u003cstrong>推薦路徑\u003c/strong>：釐清需求 → 選定演算法 → 單區 Redis 實作 → 多維度與熱點 → 全域配額 → 失敗政策與觀測。容量估算是需求驅動的分支。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#設計入口與需求邊界\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"8cb5fbd7-203e-405d-a316-a92a604b94e6","type":"text","x":200,"y":1101,"width":520,"height":885,"text":"\u003ch3 class=\"card-title\">限流契約：限制誰，超限怎麼辦？\u003c/h3>\u003cp>\u003cstrong>要確認的事\u003c/strong>：限流的對象，以及用完額度後對 client 的承諾。\u003c/p>\n\u003ch3 id=\"主要限流身分是什麼\">主要限流身分是什麼？\u003c/h3>\n\u003cblockquote>\n\u003cp>What is the primary rate-limit identity?\u003c/p>\n\u003cp>Should we limit by API key, tenant, user, IP address, endpoint, or a combination?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：counter key、租戶公平性與資料分區方式。外部 API 平台通常優先考慮 API key 或 tenant；多個使用者可能共用 NAT IP，只以 IP 限流可能誤傷合法流量。\u003c/p>\n\u003ch3 id=\"超限後怎麼處理\">超限後怎麼處理？\u003c/h3>\n\u003cblockquote>\n\u003cp>What should happen when a client exceeds the limit?\u003c/p>\n\u003cp>Should we reject immediately with HTTP 429 and a Retry-After header, queue requests, or degrade service?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：client retry behavior、下游負載、API contract 與可觀測性。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#限流契約限制誰超限怎麼辦\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"89098798-41f9-41fa-b942-1ee67213876d","type":"text","x":370,"y":238,"width":520,"height":741,"text":"\u003ch3 class=\"card-title\">容量估算與 Hot Path 狀態\u003c/h3>\u003cp>\u003cstrong>先分清 hot path 狀態與 request log\u003c/strong>：每次判定只需要 bucket state（剩餘 token、lastRefill）。IP、device、browser 等 request metadata 屬於稽核或分析 log，非同步寫入 ELK、ClickHouse 或 object storage，不進入判定路徑。\u003c/p>\n\u003cp>\u003cstrong>狀態量以 active key 估算\u003c/strong>：每個 key 的欄位約 32 bytes，100 萬個 key 的原始資料約 32MB；加上 Redis 每個 key 約 50–100 bytes 的額外開銷後約 100MB 級，單一 Redis node 就能容納。TTL 約為 capacity ÷ refillRate，讓閒置 key 自動回收。\u003c/p>\n\u003cp>\u003cstrong>吞吐與延遲預算決定 Redis 規模\u003c/strong>：Redis ops/s ≈ 峰值 QPS × 每個 request 檢查的維度數，例如 10k QPS × 4 個維度 = 40k ops/s。limiter 加在每個 request 上，判定預算通常只有個位數 ms，所以 Redis 呼叫要設短 timeout，並且就近部署。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#容量估算與-hot-path-狀態\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"e3ff2d2f-4a85-4fbd-8149-2719d4648c8a","type":"text","x":720,"y":1101,"width":520,"height":871,"text":"\u003ch3 class=\"card-title\">流量語意：允許 burst，還是嚴格時間窗？\u003c/h3>\u003cp>\u003cstrong>要確認的事\u003c/strong>：短暫尖峰是否可接受，以及限制要精確到什麼程度。這兩項需求是演算法選擇的依據，不是先選演算法再補理由。\u003c/p>\n\u003cblockquote>\n\u003cp>Should clients be allowed to send short bursts, as long as their average request rate stays within the plan limit?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：是否需要允許短暫 burst，以及是否適合採用 Token Bucket。\u003c/p>\n\u003cblockquote>\n\u003cp>Do we need an exact limit over a rolling time window, or is approximate enforcement acceptable?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：限流精確度、儲存與計算成本，以及請求延遲。例如「任何連續 60 秒不得超過 1,000 次」比「每分鐘大致不超過 1,000 次」更嚴格。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#流量語意允許-burst還是嚴格時間窗\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"ed7e99e9-8906-48ec-8c91-816ecac75f8a","type":"text","x":1240,"y":1101,"width":520,"height":769,"text":"\u003ch3 class=\"card-title\">全域語意：跨區共享多少額度，規則多久生效？\u003c/h3>\u003cp>\u003cstrong>要確認的事\u003c/strong>：限額的跨區範圍，以及設定更新容許多長的傳播時間。\u003c/p>\n\u003cblockquote>\n\u003cp>Do we need global limits across all regions, per-region limits, or both?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：region 是否必須共享計數器、跨 region 延遲，以及可接受的一致性誤差。要明確詢問是否容許短暫超限或跨區協調延遲。\u003c/p>\n\u003cblockquote>\n\u003cp>How quickly must rule changes take effect?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：config propagation、cache 策略，以及是否容許短時間使用舊規則。跨區額度判定不等於導流，見 \u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E8%A8%AD%E8%A8%88%E5%85%A5%E5%8F%A3%E8%88%87%E9%9C%80%E6%B1%82%E9%82%8A%E7%95%8C\">設計入口與需求邊界\u003c/a>。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#全域語意跨區共享多少額度規則多久生效\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"4f523963-7531-477d-97d1-68445ff0ca9d","type":"text","x":2900,"y":2530,"width":520,"height":782,"text":"\u003ch3 class=\"card-title\">Global：Multi-region 與 Quota 分配\u003c/h3>\u003cp>\u003cstrong>Per-region 與 global limit 是不同語意\u003c/strong>：各 region 使用本地 Redis 延遲最低、故障隔離最好，但同一 client 跨區請求會放大全域額度。先決定可接受多少 over-admission、跨區延遲與單點風險。\u003c/p>\n\u003cp>\u003cstrong>三種協調強度對應不同 endpoint 風險\u003c/strong>：per-region limit 適合可容忍誤差；強一致 global counter 適合低 QPS、高價值且不能超限的操作；quota allocation 由中央控制面發 regional leases、在本地快速判定，是常見折衷。\u003c/p>\n\u003cp>\u003cstrong>熱路徑保持本地，誤差必須可量化\u003c/strong>：一般 API 平台採 regional Token Bucket 加 centrally allocated quota。資料面維持低延遲，控制面管理公平性、quota 補貨與 rule propagation，並讓 lease 誤差可觀測。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#globalmulti-region-與-quota-分配\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"00d2cf96-5014-473f-861f-906bd4f1ee83","type":"text","x":2900,"y":890,"width":520,"height":1359,"text":"\u003ch3 class=\"card-title\">Token Bucket：Redis State 與原子判定\u003c/h3>\u003cp>\u003cstrong>Bucket state 只保存可變計數\u003c/strong>：每個 \u003ccode>API key + endpoint group\u003c/code> 保存剩餘 token 與 \u003ccode>lastRefillMs\u003c/code>；capacity、refill rate 與 request cost 從設定服務或快取取得。\u003c/p>\n\u003cp>\u003cstrong>每次請求先 refill，再判定與扣除\u003c/strong>：\u003c/p>\n\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmtext>refilled\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmi>min\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmtext>capacity\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>oldTokens\u003c/mtext>\u003cmo>+\u003c/mo>\u003cmtext>elapsedMs\u003c/mtext>\u003cmo>×\u003c/mo>\u003cmtext>refillRate\u003c/mtext>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1000\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\text{refilled} = \\min(\\text{capacity}, \\text{oldTokens} + \\text{elapsedMs} \\times \\text{refillRate} / 1000)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6944em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refilled\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mop\">min\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">capacity\u003c/span>\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">oldTokens\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">+\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">elapsedMs\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refillRate\u003c/span>\u003c/span>\u003cspan class=\"mord\">/1000\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\n\u003cp>若 \u003ccode>refilled >= requestCost\u003c/code>，扣除 cost 並放行；否則拒絕。bucket 不存在時可視為滿 bucket。\u003c/p>\n\u003cp>\u003cstrong>Lua script 保證同一 region 的原子性\u003c/strong>：\u003ccode>GET → application calculation → SET\u003c/code> 會讓兩個並發 request 都讀到最後一個 token 而同時放行。把「讀 state、refill、判定、扣 token、設定 TTL、回傳結果」包成單一 Redis Lua script，並使用 Redis server time 降低 gateway clock skew 的不公平。\u003c/p>\n\u003cp>\u003cstrong>回傳與 client contract\u003c/strong>：\u003ccode>allowed\u003c/code>、\u003ccode>remainingTokens\u003c/code>、\u003ccode>retryAfterMs\u003c/code>、\u003ccode>limit\u003c/code>、\u003ccode>resetAt\u003c/code>。拒絕時回 HTTP 429，附 \u003ccode>Retry-After\u003c/code>、remaining quota 與 reset time headers。\u003c/p>\n\u003cp>\u003cstrong>TTL 與回收\u003c/strong>：TTL 約為 bucket 從空補滿所需時間加上 buffer，避免不活躍 key 長期占用記憶體。\u003c/p>\n\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmtext>TTL\u003c/mtext>\u003cmo>≈\u003c/mo>\u003cmfrac>\u003cmtext>capacity\u003c/mtext>\u003cmtext>refillRate\u003c/mtext>\u003c/mfrac>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\text{TTL} \\approx \\frac{\\text{capacity}}{\\text{refillRate}}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6833em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">TTL\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">≈\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:2.0309em;vertical-align:-0.686em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.3449em;\">\u003cspan style=\"top:-2.314em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refillRate\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.677em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord text\">\u003cspan class=\"mord\">capacity\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.686em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#token-bucketredis-state-與原子判定\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"72fd46dd-ecdc-48f0-a78c-b62fcadb1fdc","type":"text","x":900,"y":2265,"width":520,"height":785,"text":"\u003ch3 class=\"card-title\">Token Bucket：允許有限的短暫 burst\u003c/h3>\u003cp>\u003cstrong>核心想法\u003c/strong>：bucket 內有 token，token 依固定速率 r 補充；每個 request 消耗一個 token，有 token 就通過，沒有就拒絕或等待。容量 B 限制最多可累積多少未使用額度：r 控制長期平均速率，B 控制最大 burst。\u003c/p>\n\u003cul>\n\u003cli>例：capacity = 10，refill rate = 10 requests/minute。滿 bucket 的 client 可以在瞬間送出 10 個 request，之後必須等待 token 逐步補回。\u003c/li>\n\u003cli>不排隊、不增加延遲，適合延遲優先的 API。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：public API gateway、依 API key／tenant／user／endpoint 執行不同方案的 quota、login 與 password reset 的 abuse protection。\u003c/p>\n\u003cblockquote>\n\u003cp>Use Token Bucket when we need to enforce a long-term average rate while allowing bounded short bursts.\u003c/p>\n\u003c/blockquote>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#token-bucket允許有限的短暫-burst\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"59ec809e-3af1-4b5f-8541-72be6b99e005","type":"text","x":1420,"y":2265,"width":520,"height":911,"text":"\u003ch3 class=\"card-title\">Leaky Bucket：以固定節奏保護下游\u003c/h3>\u003cp>\u003cstrong>核心想法\u003c/strong>：請求先進入有限 FIFO queue，再以近似固定速率流向下游；queue 滿時，新請求必須被拒絕、丟棄或採取其他明確策略。它本質上是 traffic shaping，控制工作送往下游的節奏。\u003c/p>\n\u003cul>\n\u003cli>例：client 在同一秒送來 10 個工作，但 worker 每 6 秒只取出 1 個；下游看到的是穩定流量。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：吞吐固定或昂貴的下游（payment processor、email provider、第三方 API）、非同步 job pipeline、寫入資料庫或批次任務前的節流。\u003c/p>\n\u003cp>\u003cstrong>限制\u003c/strong>：同步 API 不宜長時間排隊，否則 client 可能 timeout，服務也會累積連線與記憶體壓力。常見做法是 gateway 先用 Token Bucket admission control，再對非同步工作使用 queue-based shaping。\u003c/p>\n\u003cblockquote>\n\u003cp>Use a Leaky Bucket or queue-based shaper when the downstream system needs a predictable, smoothed request rate.\u003c/p>\n\u003c/blockquote>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#leaky-bucket以固定節奏保護下游\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"4e4befd6-a49a-4552-a4a0-0fb6042252c5","type":"text","x":1940,"y":2265,"width":520,"height":912,"text":"\u003ch3 class=\"card-title\">Sliding Window：嚴格遵守最近一段連續時間的上限\u003c/h3>\u003cp>\u003cstrong>核心想法\u003c/strong>：計算最近一個連續時間區間內已發生的 request。規則是「任何連續 60 秒最多 10 次」時，每次請求都要考慮前 60 秒，而不是只看目前落在哪一個固定分鐘。\u003c/p>\n\u003cul>\n\u003cli>邊界例子：client 在 00:59 發 10 次，在 01:00 再發 10 次。Fixed Window 會把兩批分屬不同分鐘而放行 20 次，交界處約 2 倍流量；Sliding Window 會看見前一批仍在最近 60 秒內而拒絕第二批。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：合約明確承諾 rolling 上限、anti-abuse 與登入保護、單一 endpoint 的精確短期控制。\u003c/p>\n\u003cp>\u003cstrong>代價\u003c/strong>：精準版本需要保存更多 timestamp state，或改用近似的 sliding-window counter；高 QPS 與大量 key 下要考慮記憶體、TTL、sharding 與原子計數。\u003c/p>\n\u003cblockquote>\n\u003cp>Use Sliding Window when the product requires a strict limit over any rolling time interval, not merely an approximate average rate.\u003c/p>\n\u003c/blockquote>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#sliding-window嚴格遵守最近一段連續時間的上限\">閱讀全文 →\u003c/a>\u003c/p>"},{"id":"a628e912-a3b0-4399-8052-b91ca843d9a7","type":"text","x":1940,"y":1260,"width":520,"height":638,"text":"\u003ch3 class=\"card-title\">Rate Limiting 演算法選型\u003c/h3>\u003cul>\n\u003cli>\u003cstrong>允許有限 burst → Token Bucket\u003c/strong>：適合 API gateway 的 admission control；代價是要決定 refill rate、bucket size，並處理分散式 counter 的一致性與原子性。\u003c/li>\n\u003cli>\u003cstrong>平滑下游吞吐 → Leaky Bucket\u003c/strong>：適合 payment、email、非同步 worker 或第三方 API；代價是排隊延遲。\u003c/li>\n\u003cli>\u003cstrong>嚴格連續時間窗 → Sliding Window\u003c/strong>：適合 anti-abuse 或合約明定的 rolling limit；精準版本需要更多 state 與計算。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>可以組合，不必三選一\u003c/strong>：同步 API 用 Token Bucket 保護准入，非同步工作再用 queue-based shaper 平滑。\u003c/p>\u003cp class=\"card-more\">\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#rate-limiting-演算法選型\">閱讀全文 →\u003c/a>\u003c/p>"}],"edges":[{"id":"e0","fromNode":"16c943ec-35ea-4013-bb05-763c69da7147","fromSide":"bottom","toNode":"a628e912-a3b0-4399-8052-b91ca843d9a7","toSide":"top","label":"需求決定策略"},{"id":"e1","fromNode":"a628e912-a3b0-4399-8052-b91ca843d9a7","fromSide":"right","toNode":"00d2cf96-5014-473f-861f-906bd4f1ee83","toSide":"left","label":"選定 Token Bucket 後實作"},{"id":"e2","fromNode":"00d2cf96-5014-473f-861f-906bd4f1ee83","fromSide":"bottom","toNode":"4f523963-7531-477d-97d1-68445ff0ca9d","toSide":"top","label":"從單區延伸至 global"},{"id":"e3","fromNode":"4f523963-7531-477d-97d1-68445ff0ca9d","fromSide":"right","toNode":"b44f34f8-8455-4404-95ce-0b7a8b6ad05a","toSide":"left","label":"定義失敗政策與觀測"},{"id":"e4","fromNode":"16c943ec-35ea-4013-bb05-763c69da7147","fromSide":"left","toNode":"89098798-41f9-41fa-b942-1ee67213876d","toSide":"right","label":"估算狀態與吞吐"},{"id":"e5","fromNode":"00d2cf96-5014-473f-861f-906bd4f1ee83","fromSide":"right","toNode":"d923ec79-bb9a-4414-8a2f-4b0b56870bbd","toSide":"left","label":"延伸到多維度與熱點"}]}</script><script type="application/json" id="reader-data">{"cards":{"b44f34f8-8455-4404-95ce-0b7a8b6ad05a":{"note":"global-api-rate-limiter","section":"failure-handling-與-observability"},"d923ec79-bb9a-4414-8a2f-4b0b56870bbd":{"note":"global-api-rate-limiter","section":"多維度-key-與熱點"},"16c943ec-35ea-4013-bb05-763c69da7147":{"note":"global-api-rate-limiter","section":"設計入口與需求邊界"},"8cb5fbd7-203e-405d-a316-a92a604b94e6":{"note":"global-api-rate-limiter","section":"限流契約限制誰超限怎麼辦"},"89098798-41f9-41fa-b942-1ee67213876d":{"note":"global-api-rate-limiter","section":"容量估算與-hot-path-狀態"},"e3ff2d2f-4a85-4fbd-8149-2719d4648c8a":{"note":"global-api-rate-limiter","section":"流量語意允許-burst還是嚴格時間窗"},"ed7e99e9-8906-48ec-8c91-816ecac75f8a":{"note":"global-api-rate-limiter","section":"全域語意跨區共享多少額度規則多久生效"},"4f523963-7531-477d-97d1-68445ff0ca9d":{"note":"global-api-rate-limiter","section":"globalmulti-region-與-quota-分配"},"00d2cf96-5014-473f-861f-906bd4f1ee83":{"note":"global-api-rate-limiter","section":"token-bucketredis-state-與原子判定"},"72fd46dd-ecdc-48f0-a78c-b62fcadb1fdc":{"note":"global-api-rate-limiter","section":"token-bucket允許有限的短暫-burst"},"59ec809e-3af1-4b5f-8541-72be6b99e005":{"note":"global-api-rate-limiter","section":"leaky-bucket以固定節奏保護下游"},"4e4befd6-a49a-4552-a4a0-0fb6042252c5":{"note":"global-api-rate-limiter","section":"sliding-window嚴格遵守最近一段連續時間的上限"},"a628e912-a3b0-4399-8052-b91ca843d9a7":{"note":"global-api-rate-limiter","section":"rate-limiting-演算法選型"}},"notes":{"global-api-rate-limiter":{"title":"Global API Rate Limiter 設計","url":"/growth-site/03-architecture/global-api-rate-limiter/","html":"\u003ch2 id=\"設計入口與需求邊界\">設計入口與需求邊界\u003c/h2>\n\u003cp>\u003cstrong>先分清三件事\u003c/strong>：需求問題用來確認必要的限制與行為；設計假設是在資訊不足時明示暫定前提；設計選擇才是依需求決定 key、演算法、儲存與跨區協調。不要直接假設以 IP 限流，也不要先挑演算法。\u003c/p>\n\u003cp>需求問答有三個並列面向，不是執行步驟：\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E9%99%90%E6%B5%81%E5%A5%91%E7%B4%84%E9%99%90%E5%88%B6%E8%AA%B0%E8%B6%85%E9%99%90%E6%80%8E%E9%BA%BC%E8%BE%A6\">限流契約：限制誰，超限怎麼辦？\u003c/a>、\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E6%B5%81%E9%87%8F%E8%AA%9E%E6%84%8F%E5%85%81%E8%A8%B1-burst%E9%82%84%E6%98%AF%E5%9A%B4%E6%A0%BC%E6%99%82%E9%96%93%E7%AA%97\">流量語意：允許 burst，還是嚴格時間窗？\u003c/a>、\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E5%85%A8%E5%9F%9F%E8%AA%9E%E6%84%8F%E8%B7%A8%E5%8D%80%E5%85%B1%E4%BA%AB%E5%A4%9A%E5%B0%91%E9%A1%8D%E5%BA%A6%E8%A6%8F%E5%89%87%E5%A4%9A%E4%B9%85%E7%94%9F%E6%95%88\">全域語意：跨區共享多少額度，規則多久生效？\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>責任邊界\u003c/strong>：DNS、Global Load Balancer 或 routing layer 決定 client 前往哪個 region；Rate Limiter 依規則判定請求是否可進入，保護可用性、公平性與下游容量。\u003c/p>\n\u003cp>\u003cstrong>推薦路徑\u003c/strong>：釐清需求 → 選定演算法 → 單區 Redis 實作 → 多維度與熱點 → 全域配額 → 失敗政策與觀測。容量估算是需求驅動的分支。\u003c/p>\n\u003ch2 id=\"限流契約限制誰超限怎麼辦\">限流契約：限制誰，超限怎麼辦？\u003c/h2>\n\u003cp>\u003cstrong>要確認的事\u003c/strong>：限流的對象，以及用完額度後對 client 的承諾。\u003c/p>\n\u003ch3 id=\"主要限流身分是什麼\">主要限流身分是什麼？\u003c/h3>\n\u003cblockquote>\n\u003cp>What is the primary rate-limit identity?\u003c/p>\n\u003cp>Should we limit by API key, tenant, user, IP address, endpoint, or a combination?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：counter key、租戶公平性與資料分區方式。外部 API 平台通常優先考慮 API key 或 tenant；多個使用者可能共用 NAT IP，只以 IP 限流可能誤傷合法流量。\u003c/p>\n\u003ch3 id=\"超限後怎麼處理\">超限後怎麼處理？\u003c/h3>\n\u003cblockquote>\n\u003cp>What should happen when a client exceeds the limit?\u003c/p>\n\u003cp>Should we reject immediately with HTTP 429 and a Retry-After header, queue requests, or degrade service?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：client retry behavior、下游負載、API contract 與可觀測性。\u003c/p>\n\u003ch2 id=\"流量語意允許-burst還是嚴格時間窗\">流量語意：允許 burst，還是嚴格時間窗？\u003c/h2>\n\u003cp>\u003cstrong>要確認的事\u003c/strong>：短暫尖峰是否可接受，以及限制要精確到什麼程度。這兩項需求是演算法選擇的依據，不是先選演算法再補理由。\u003c/p>\n\u003cblockquote>\n\u003cp>Should clients be allowed to send short bursts, as long as their average request rate stays within the plan limit?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：是否需要允許短暫 burst，以及是否適合採用 Token Bucket。\u003c/p>\n\u003cblockquote>\n\u003cp>Do we need an exact limit over a rolling time window, or is approximate enforcement acceptable?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：限流精確度、儲存與計算成本，以及請求延遲。例如「任何連續 60 秒不得超過 1,000 次」比「每分鐘大致不超過 1,000 次」更嚴格。\u003c/p>\n\u003ch2 id=\"全域語意跨區共享多少額度規則多久生效\">全域語意：跨區共享多少額度，規則多久生效？\u003c/h2>\n\u003cp>\u003cstrong>要確認的事\u003c/strong>：限額的跨區範圍，以及設定更新容許多長的傳播時間。\u003c/p>\n\u003cblockquote>\n\u003cp>Do we need global limits across all regions, per-region limits, or both?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：region 是否必須共享計數器、跨 region 延遲，以及可接受的一致性誤差。要明確詢問是否容許短暫超限或跨區協調延遲。\u003c/p>\n\u003cblockquote>\n\u003cp>How quickly must rule changes take effect?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：config propagation、cache 策略，以及是否容許短時間使用舊規則。跨區額度判定不等於導流，見 \u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E8%A8%AD%E8%A8%88%E5%85%A5%E5%8F%A3%E8%88%87%E9%9C%80%E6%B1%82%E9%82%8A%E7%95%8C\">設計入口與需求邊界\u003c/a>。\u003c/p>\n\u003ch2 id=\"容量估算與-hot-path-狀態\">容量估算與 Hot Path 狀態\u003c/h2>\n\u003cp>\u003cstrong>先分清 hot path 狀態與 request log\u003c/strong>：每次判定只需要 bucket state（剩餘 token、lastRefill）。IP、device、browser 等 request metadata 屬於稽核或分析 log，非同步寫入 ELK、ClickHouse 或 object storage，不進入判定路徑。\u003c/p>\n\u003cp>\u003cstrong>狀態量以 active key 估算\u003c/strong>：每個 key 的欄位約 32 bytes，100 萬個 key 的原始資料約 32MB；加上 Redis 每個 key 約 50–100 bytes 的額外開銷後約 100MB 級，單一 Redis node 就能容納。TTL 約為 capacity ÷ refillRate，讓閒置 key 自動回收。\u003c/p>\n\u003cp>\u003cstrong>吞吐與延遲預算決定 Redis 規模\u003c/strong>：Redis ops/s ≈ 峰值 QPS × 每個 request 檢查的維度數，例如 10k QPS × 4 個維度 = 40k ops/s。limiter 加在每個 request 上，判定預算通常只有個位數 ms，所以 Redis 呼叫要設短 timeout，並且就近部署。\u003c/p>\n\u003ch2 id=\"rate-limiting-演算法選型\">Rate Limiting 演算法選型\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>允許有限 burst → Token Bucket\u003c/strong>：適合 API gateway 的 admission control；代價是要決定 refill rate、bucket size，並處理分散式 counter 的一致性與原子性。\u003c/li>\n\u003cli>\u003cstrong>平滑下游吞吐 → Leaky Bucket\u003c/strong>：適合 payment、email、非同步 worker 或第三方 API；代價是排隊延遲。\u003c/li>\n\u003cli>\u003cstrong>嚴格連續時間窗 → Sliding Window\u003c/strong>：適合 anti-abuse 或合約明定的 rolling limit；精準版本需要更多 state 與計算。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>可以組合，不必三選一\u003c/strong>：同步 API 用 Token Bucket 保護准入，非同步工作再用 queue-based shaper 平滑。\u003c/p>\n\u003ch2 id=\"token-bucket允許有限的短暫-burst\">Token Bucket：允許有限的短暫 burst\u003c/h2>\n\u003cp>\u003cstrong>核心想法\u003c/strong>：bucket 內有 token，token 依固定速率 r 補充；每個 request 消耗一個 token，有 token 就通過，沒有就拒絕或等待。容量 B 限制最多可累積多少未使用額度：r 控制長期平均速率，B 控制最大 burst。\u003c/p>\n\u003cul>\n\u003cli>例：capacity = 10，refill rate = 10 requests/minute。滿 bucket 的 client 可以在瞬間送出 10 個 request，之後必須等待 token 逐步補回。\u003c/li>\n\u003cli>不排隊、不增加延遲，適合延遲優先的 API。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：public API gateway、依 API key／tenant／user／endpoint 執行不同方案的 quota、login 與 password reset 的 abuse protection。\u003c/p>\n\u003cblockquote>\n\u003cp>Use Token Bucket when we need to enforce a long-term average rate while allowing bounded short bursts.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"leaky-bucket以固定節奏保護下游\">Leaky Bucket：以固定節奏保護下游\u003c/h2>\n\u003cp>\u003cstrong>核心想法\u003c/strong>：請求先進入有限 FIFO queue，再以近似固定速率流向下游；queue 滿時，新請求必須被拒絕、丟棄或採取其他明確策略。它本質上是 traffic shaping，控制工作送往下游的節奏。\u003c/p>\n\u003cul>\n\u003cli>例：client 在同一秒送來 10 個工作，但 worker 每 6 秒只取出 1 個；下游看到的是穩定流量。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：吞吐固定或昂貴的下游（payment processor、email provider、第三方 API）、非同步 job pipeline、寫入資料庫或批次任務前的節流。\u003c/p>\n\u003cp>\u003cstrong>限制\u003c/strong>：同步 API 不宜長時間排隊，否則 client 可能 timeout，服務也會累積連線與記憶體壓力。常見做法是 gateway 先用 Token Bucket admission control，再對非同步工作使用 queue-based shaping。\u003c/p>\n\u003cblockquote>\n\u003cp>Use a Leaky Bucket or queue-based shaper when the downstream system needs a predictable, smoothed request rate.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"sliding-window嚴格遵守最近一段連續時間的上限\">Sliding Window：嚴格遵守最近一段連續時間的上限\u003c/h2>\n\u003cp>\u003cstrong>核心想法\u003c/strong>：計算最近一個連續時間區間內已發生的 request。規則是「任何連續 60 秒最多 10 次」時，每次請求都要考慮前 60 秒，而不是只看目前落在哪一個固定分鐘。\u003c/p>\n\u003cul>\n\u003cli>邊界例子：client 在 00:59 發 10 次，在 01:00 再發 10 次。Fixed Window 會把兩批分屬不同分鐘而放行 20 次，交界處約 2 倍流量；Sliding Window 會看見前一批仍在最近 60 秒內而拒絕第二批。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：合約明確承諾 rolling 上限、anti-abuse 與登入保護、單一 endpoint 的精確短期控制。\u003c/p>\n\u003cp>\u003cstrong>代價\u003c/strong>：精準版本需要保存更多 timestamp state，或改用近似的 sliding-window counter；高 QPS 與大量 key 下要考慮記憶體、TTL、sharding 與原子計數。\u003c/p>\n\u003cblockquote>\n\u003cp>Use Sliding Window when the product requires a strict limit over any rolling time interval, not merely an approximate average rate.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"token-bucketredis-state-與原子判定\">Token Bucket：Redis State 與原子判定\u003c/h2>\n\u003cp>\u003cstrong>Bucket state 只保存可變計數\u003c/strong>：每個 \u003ccode>API key + endpoint group\u003c/code> 保存剩餘 token 與 \u003ccode>lastRefillMs\u003c/code>；capacity、refill rate 與 request cost 從設定服務或快取取得。\u003c/p>\n\u003cp>\u003cstrong>每次請求先 refill，再判定與扣除\u003c/strong>：\u003c/p>\n\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmtext>refilled\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmi>min\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmtext>capacity\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>oldTokens\u003c/mtext>\u003cmo>+\u003c/mo>\u003cmtext>elapsedMs\u003c/mtext>\u003cmo>×\u003c/mo>\u003cmtext>refillRate\u003c/mtext>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1000\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\text{refilled} = \\min(\\text{capacity}, \\text{oldTokens} + \\text{elapsedMs} \\times \\text{refillRate} / 1000)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6944em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refilled\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mop\">min\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">capacity\u003c/span>\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">oldTokens\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">+\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">elapsedMs\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refillRate\u003c/span>\u003c/span>\u003cspan class=\"mord\">/1000\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\n\u003cp>若 \u003ccode>refilled >= requestCost\u003c/code>，扣除 cost 並放行；否則拒絕。bucket 不存在時可視為滿 bucket。\u003c/p>\n\u003cp>\u003cstrong>Lua script 保證同一 region 的原子性\u003c/strong>：\u003ccode>GET → application calculation → SET\u003c/code> 會讓兩個並發 request 都讀到最後一個 token 而同時放行。把「讀 state、refill、判定、扣 token、設定 TTL、回傳結果」包成單一 Redis Lua script，並使用 Redis server time 降低 gateway clock skew 的不公平。\u003c/p>\n\u003cp>\u003cstrong>回傳與 client contract\u003c/strong>：\u003ccode>allowed\u003c/code>、\u003ccode>remainingTokens\u003c/code>、\u003ccode>retryAfterMs\u003c/code>、\u003ccode>limit\u003c/code>、\u003ccode>resetAt\u003c/code>。拒絕時回 HTTP 429，附 \u003ccode>Retry-After\u003c/code>、remaining quota 與 reset time headers。\u003c/p>\n\u003cp>\u003cstrong>TTL 與回收\u003c/strong>：TTL 約為 bucket 從空補滿所需時間加上 buffer，避免不活躍 key 長期占用記憶體。\u003c/p>\n\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmtext>TTL\u003c/mtext>\u003cmo>≈\u003c/mo>\u003cmfrac>\u003cmtext>capacity\u003c/mtext>\u003cmtext>refillRate\u003c/mtext>\u003c/mfrac>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\text{TTL} \\approx \\frac{\\text{capacity}}{\\text{refillRate}}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6833em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">TTL\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">≈\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:2.0309em;vertical-align:-0.686em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.3449em;\">\u003cspan style=\"top:-2.314em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refillRate\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.677em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord text\">\u003cspan class=\"mord\">capacity\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.686em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\n\u003ch2 id=\"多維度-key-與熱點\">多維度 Key 與熱點\u003c/h2>\n\u003cp>\u003cstrong>每個維度一個 bucket，全部通過才放行\u003c/strong>：API、商戶、domain、region 各有自己的 key，例如 \u003ccode>rl:{merchant:m42}:api:POST/orders\u003c/code>。在同一個 Lua script 裡先檢查所有 bucket、再一起扣除，避免某個維度已扣、另一個維度卻拒絕。\u003c/p>\n\u003cp>\u003cstrong>Redis Cluster 的 slot 限制\u003c/strong>：一個 Lua script 只能操作同一個 slot 的 key。用 hash tag \u003ccode>{merchant:m42}\u003c/code> 讓同一商戶的各維度落在同一個 slot；domain、region 這類共用 key 分開呼叫，或改用本地近似計數。\u003c/p>\n\u003cp>\u003cstrong>熱點 key 的處理\u003c/strong>：大商戶或全域 region 的 key 會集中打到同一個 shard。常見做法是 local token lease（一次向 Redis 預取一批 token 在本地扣）、把 key 拆成 N 個子 bucket 各分 1/N 額度，或對共用維度改用本地近似限流再定期同步。代價是可能短暫超限，誤差必須可觀測。\u003c/p>\n\u003ch2 id=\"globalmulti-region-與-quota-分配\">Global：Multi-region 與 Quota 分配\u003c/h2>\n\u003cp>\u003cstrong>Per-region 與 global limit 是不同語意\u003c/strong>：各 region 使用本地 Redis 延遲最低、故障隔離最好，但同一 client 跨區請求會放大全域額度。先決定可接受多少 over-admission、跨區延遲與單點風險。\u003c/p>\n\u003cp>\u003cstrong>三種協調強度對應不同 endpoint 風險\u003c/strong>：per-region limit 適合可容忍誤差；強一致 global counter 適合低 QPS、高價值且不能超限的操作；quota allocation 由中央控制面發 regional leases、在本地快速判定，是常見折衷。\u003c/p>\n\u003cp>\u003cstrong>熱路徑保持本地，誤差必須可量化\u003c/strong>：一般 API 平台採 regional Token Bucket 加 centrally allocated quota。資料面維持低延遲，控制面管理公平性、quota 補貨與 rule propagation，並讓 lease 誤差可觀測。\u003c/p>\n\u003ch2 id=\"failure-handling-與-observability\">Failure Handling 與 Observability\u003c/h2>\n\u003cp>\u003cstrong>Failure policy 依 endpoint 風險選擇\u003c/strong>：Redis、config service 或 quota control plane 失敗時，高風險、付費或易 abuse 的 endpoint 採 fail closed；低風險讀取可短暫 fail open；也可退回保守的 local static limit。Redis 呼叫設 5–10ms timeout 加 circuit breaker：滑動時間窗內錯誤率超過門檻就切到本地 1/N 額度，half-open 時放少量請求探測恢復。\u003c/p>\n\u003cp>\u003cstrong>Client contract 必須避免 retry storm\u003c/strong>：超限回 \u003ccode>429\u003c/code>，附 \u003ccode>Retry-After\u003c/code>、remaining quota、limit 與 reset time，讓 client 使用 backoff 加 jitter。\u003c/p>\n\u003cp>\u003cstrong>觀測同時證明保護與公平\u003c/strong>：量測 allow／reject rate、decision latency、error rate、bucket remaining、quota lease、over-admission、config propagation、top rejected clients 與熱點 endpoint。每個 global 誤差都要可量化與可觀測。\u003c/p>","sections":{"設計入口與需求邊界":{"heading":"設計入口與需求邊界","html":"\u003cp>\u003cstrong>先分清三件事\u003c/strong>：需求問題用來確認必要的限制與行為；設計假設是在資訊不足時明示暫定前提；設計選擇才是依需求決定 key、演算法、儲存與跨區協調。不要直接假設以 IP 限流，也不要先挑演算法。\u003c/p>\n\u003cp>需求問答有三個並列面向，不是執行步驟：\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E9%99%90%E6%B5%81%E5%A5%91%E7%B4%84%E9%99%90%E5%88%B6%E8%AA%B0%E8%B6%85%E9%99%90%E6%80%8E%E9%BA%BC%E8%BE%A6\">限流契約：限制誰，超限怎麼辦？\u003c/a>、\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E6%B5%81%E9%87%8F%E8%AA%9E%E6%84%8F%E5%85%81%E8%A8%B1-burst%E9%82%84%E6%98%AF%E5%9A%B4%E6%A0%BC%E6%99%82%E9%96%93%E7%AA%97\">流量語意：允許 burst，還是嚴格時間窗？\u003c/a>、\u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E5%85%A8%E5%9F%9F%E8%AA%9E%E6%84%8F%E8%B7%A8%E5%8D%80%E5%85%B1%E4%BA%AB%E5%A4%9A%E5%B0%91%E9%A1%8D%E5%BA%A6%E8%A6%8F%E5%89%87%E5%A4%9A%E4%B9%85%E7%94%9F%E6%95%88\">全域語意：跨區共享多少額度，規則多久生效？\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>責任邊界\u003c/strong>：DNS、Global Load Balancer 或 routing layer 決定 client 前往哪個 region；Rate Limiter 依規則判定請求是否可進入，保護可用性、公平性與下游容量。\u003c/p>\n\u003cp>\u003cstrong>推薦路徑\u003c/strong>：釐清需求 → 選定演算法 → 單區 Redis 實作 → 多維度與熱點 → 全域配額 → 失敗政策與觀測。容量估算是需求驅動的分支。\u003c/p>"},"限流契約限制誰超限怎麼辦":{"heading":"限流契約：限制誰，超限怎麼辦？","html":"\u003cp>\u003cstrong>要確認的事\u003c/strong>：限流的對象，以及用完額度後對 client 的承諾。\u003c/p>\n\u003ch3 id=\"主要限流身分是什麼\">主要限流身分是什麼？\u003c/h3>\n\u003cblockquote>\n\u003cp>What is the primary rate-limit identity?\u003c/p>\n\u003cp>Should we limit by API key, tenant, user, IP address, endpoint, or a combination?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：counter key、租戶公平性與資料分區方式。外部 API 平台通常優先考慮 API key 或 tenant；多個使用者可能共用 NAT IP，只以 IP 限流可能誤傷合法流量。\u003c/p>\n\u003ch3 id=\"超限後怎麼處理\">超限後怎麼處理？\u003c/h3>\n\u003cblockquote>\n\u003cp>What should happen when a client exceeds the limit?\u003c/p>\n\u003cp>Should we reject immediately with HTTP 429 and a Retry-After header, queue requests, or degrade service?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：client retry behavior、下游負載、API contract 與可觀測性。\u003c/p>"},"流量語意允許-burst還是嚴格時間窗":{"heading":"流量語意：允許 burst，還是嚴格時間窗？","html":"\u003cp>\u003cstrong>要確認的事\u003c/strong>：短暫尖峰是否可接受，以及限制要精確到什麼程度。這兩項需求是演算法選擇的依據，不是先選演算法再補理由。\u003c/p>\n\u003cblockquote>\n\u003cp>Should clients be allowed to send short bursts, as long as their average request rate stays within the plan limit?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：是否需要允許短暫 burst，以及是否適合採用 Token Bucket。\u003c/p>\n\u003cblockquote>\n\u003cp>Do we need an exact limit over a rolling time window, or is approximate enforcement acceptable?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：限流精確度、儲存與計算成本，以及請求延遲。例如「任何連續 60 秒不得超過 1,000 次」比「每分鐘大致不超過 1,000 次」更嚴格。\u003c/p>"},"全域語意跨區共享多少額度規則多久生效":{"heading":"全域語意：跨區共享多少額度，規則多久生效？","html":"\u003cp>\u003cstrong>要確認的事\u003c/strong>：限額的跨區範圍，以及設定更新容許多長的傳播時間。\u003c/p>\n\u003cblockquote>\n\u003cp>Do we need global limits across all regions, per-region limits, or both?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：region 是否必須共享計數器、跨 region 延遲，以及可接受的一致性誤差。要明確詢問是否容許短暫超限或跨區協調延遲。\u003c/p>\n\u003cblockquote>\n\u003cp>How quickly must rule changes take effect?\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>影響的決策\u003c/strong>：config propagation、cache 策略，以及是否容許短時間使用舊規則。跨區額度判定不等於導流，見 \u003ca href=\"/growth-site/03-architecture/global-api-rate-limiter/#%E8%A8%AD%E8%A8%88%E5%85%A5%E5%8F%A3%E8%88%87%E9%9C%80%E6%B1%82%E9%82%8A%E7%95%8C\">設計入口與需求邊界\u003c/a>。\u003c/p>"},"容量估算與-hot-path-狀態":{"heading":"容量估算與 Hot Path 狀態","html":"\u003cp>\u003cstrong>先分清 hot path 狀態與 request log\u003c/strong>：每次判定只需要 bucket state（剩餘 token、lastRefill）。IP、device、browser 等 request metadata 屬於稽核或分析 log，非同步寫入 ELK、ClickHouse 或 object storage，不進入判定路徑。\u003c/p>\n\u003cp>\u003cstrong>狀態量以 active key 估算\u003c/strong>：每個 key 的欄位約 32 bytes，100 萬個 key 的原始資料約 32MB；加上 Redis 每個 key 約 50–100 bytes 的額外開銷後約 100MB 級，單一 Redis node 就能容納。TTL 約為 capacity ÷ refillRate，讓閒置 key 自動回收。\u003c/p>\n\u003cp>\u003cstrong>吞吐與延遲預算決定 Redis 規模\u003c/strong>：Redis ops/s ≈ 峰值 QPS × 每個 request 檢查的維度數，例如 10k QPS × 4 個維度 = 40k ops/s。limiter 加在每個 request 上，判定預算通常只有個位數 ms，所以 Redis 呼叫要設短 timeout，並且就近部署。\u003c/p>"},"rate-limiting-演算法選型":{"heading":"Rate Limiting 演算法選型","html":"\u003cul>\n\u003cli>\u003cstrong>允許有限 burst → Token Bucket\u003c/strong>：適合 API gateway 的 admission control；代價是要決定 refill rate、bucket size，並處理分散式 counter 的一致性與原子性。\u003c/li>\n\u003cli>\u003cstrong>平滑下游吞吐 → Leaky Bucket\u003c/strong>：適合 payment、email、非同步 worker 或第三方 API；代價是排隊延遲。\u003c/li>\n\u003cli>\u003cstrong>嚴格連續時間窗 → Sliding Window\u003c/strong>：適合 anti-abuse 或合約明定的 rolling limit；精準版本需要更多 state 與計算。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>可以組合，不必三選一\u003c/strong>：同步 API 用 Token Bucket 保護准入，非同步工作再用 queue-based shaper 平滑。\u003c/p>"},"token-bucket允許有限的短暫-burst":{"heading":"Token Bucket：允許有限的短暫 burst","html":"\u003cp>\u003cstrong>核心想法\u003c/strong>：bucket 內有 token，token 依固定速率 r 補充；每個 request 消耗一個 token，有 token 就通過，沒有就拒絕或等待。容量 B 限制最多可累積多少未使用額度：r 控制長期平均速率，B 控制最大 burst。\u003c/p>\n\u003cul>\n\u003cli>例：capacity = 10，refill rate = 10 requests/minute。滿 bucket 的 client 可以在瞬間送出 10 個 request，之後必須等待 token 逐步補回。\u003c/li>\n\u003cli>不排隊、不增加延遲，適合延遲優先的 API。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：public API gateway、依 API key／tenant／user／endpoint 執行不同方案的 quota、login 與 password reset 的 abuse protection。\u003c/p>\n\u003cblockquote>\n\u003cp>Use Token Bucket when we need to enforce a long-term average rate while allowing bounded short bursts.\u003c/p>\n\u003c/blockquote>"},"leaky-bucket以固定節奏保護下游":{"heading":"Leaky Bucket：以固定節奏保護下游","html":"\u003cp>\u003cstrong>核心想法\u003c/strong>：請求先進入有限 FIFO queue，再以近似固定速率流向下游；queue 滿時，新請求必須被拒絕、丟棄或採取其他明確策略。它本質上是 traffic shaping，控制工作送往下游的節奏。\u003c/p>\n\u003cul>\n\u003cli>例：client 在同一秒送來 10 個工作，但 worker 每 6 秒只取出 1 個；下游看到的是穩定流量。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：吞吐固定或昂貴的下游（payment processor、email provider、第三方 API）、非同步 job pipeline、寫入資料庫或批次任務前的節流。\u003c/p>\n\u003cp>\u003cstrong>限制\u003c/strong>：同步 API 不宜長時間排隊，否則 client 可能 timeout，服務也會累積連線與記憶體壓力。常見做法是 gateway 先用 Token Bucket admission control，再對非同步工作使用 queue-based shaping。\u003c/p>\n\u003cblockquote>\n\u003cp>Use a Leaky Bucket or queue-based shaper when the downstream system needs a predictable, smoothed request rate.\u003c/p>\n\u003c/blockquote>"},"sliding-window嚴格遵守最近一段連續時間的上限":{"heading":"Sliding Window：嚴格遵守最近一段連續時間的上限","html":"\u003cp>\u003cstrong>核心想法\u003c/strong>：計算最近一個連續時間區間內已發生的 request。規則是「任何連續 60 秒最多 10 次」時，每次請求都要考慮前 60 秒，而不是只看目前落在哪一個固定分鐘。\u003c/p>\n\u003cul>\n\u003cli>邊界例子：client 在 00:59 發 10 次，在 01:00 再發 10 次。Fixed Window 會把兩批分屬不同分鐘而放行 20 次，交界處約 2 倍流量；Sliding Window 會看見前一批仍在最近 60 秒內而拒絕第二批。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>實際應用\u003c/strong>：合約明確承諾 rolling 上限、anti-abuse 與登入保護、單一 endpoint 的精確短期控制。\u003c/p>\n\u003cp>\u003cstrong>代價\u003c/strong>：精準版本需要保存更多 timestamp state，或改用近似的 sliding-window counter；高 QPS 與大量 key 下要考慮記憶體、TTL、sharding 與原子計數。\u003c/p>\n\u003cblockquote>\n\u003cp>Use Sliding Window when the product requires a strict limit over any rolling time interval, not merely an approximate average rate.\u003c/p>\n\u003c/blockquote>"},"token-bucketredis-state-與原子判定":{"heading":"Token Bucket：Redis State 與原子判定","html":"\u003cp>\u003cstrong>Bucket state 只保存可變計數\u003c/strong>：每個 \u003ccode>API key + endpoint group\u003c/code> 保存剩餘 token 與 \u003ccode>lastRefillMs\u003c/code>；capacity、refill rate 與 request cost 從設定服務或快取取得。\u003c/p>\n\u003cp>\u003cstrong>每次請求先 refill，再判定與扣除\u003c/strong>：\u003c/p>\n\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmtext>refilled\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmi>min\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmtext>capacity\u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext>oldTokens\u003c/mtext>\u003cmo>+\u003c/mo>\u003cmtext>elapsedMs\u003c/mtext>\u003cmo>×\u003c/mo>\u003cmtext>refillRate\u003c/mtext>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1000\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\text{refilled} = \\min(\\text{capacity}, \\text{oldTokens} + \\text{elapsedMs} \\times \\text{refillRate} / 1000)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6944em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refilled\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mop\">min\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">capacity\u003c/span>\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">oldTokens\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">+\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">elapsedMs\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refillRate\u003c/span>\u003c/span>\u003cspan class=\"mord\">/1000\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\n\u003cp>若 \u003ccode>refilled >= requestCost\u003c/code>，扣除 cost 並放行；否則拒絕。bucket 不存在時可視為滿 bucket。\u003c/p>\n\u003cp>\u003cstrong>Lua script 保證同一 region 的原子性\u003c/strong>：\u003ccode>GET → application calculation → SET\u003c/code> 會讓兩個並發 request 都讀到最後一個 token 而同時放行。把「讀 state、refill、判定、扣 token、設定 TTL、回傳結果」包成單一 Redis Lua script，並使用 Redis server time 降低 gateway clock skew 的不公平。\u003c/p>\n\u003cp>\u003cstrong>回傳與 client contract\u003c/strong>：\u003ccode>allowed\u003c/code>、\u003ccode>remainingTokens\u003c/code>、\u003ccode>retryAfterMs\u003c/code>、\u003ccode>limit\u003c/code>、\u003ccode>resetAt\u003c/code>。拒絕時回 HTTP 429，附 \u003ccode>Retry-After\u003c/code>、remaining quota 與 reset time headers。\u003c/p>\n\u003cp>\u003cstrong>TTL 與回收\u003c/strong>：TTL 約為 bucket 從空補滿所需時間加上 buffer，避免不活躍 key 長期占用記憶體。\u003c/p>\n\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmtext>TTL\u003c/mtext>\u003cmo>≈\u003c/mo>\u003cmfrac>\u003cmtext>capacity\u003c/mtext>\u003cmtext>refillRate\u003c/mtext>\u003c/mfrac>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\text{TTL} \\approx \\frac{\\text{capacity}}{\\text{refillRate}}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6833em;\">\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\">TTL\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">≈\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:2.0309em;vertical-align:-0.686em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.3449em;\">\u003cspan style=\"top:-2.314em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord text\">\u003cspan class=\"mord\">refillRate\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.677em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord text\">\u003cspan class=\"mord\">capacity\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.686em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>"},"多維度-key-與熱點":{"heading":"多維度 Key 與熱點","html":"\u003cp>\u003cstrong>每個維度一個 bucket，全部通過才放行\u003c/strong>：API、商戶、domain、region 各有自己的 key，例如 \u003ccode>rl:{merchant:m42}:api:POST/orders\u003c/code>。在同一個 Lua script 裡先檢查所有 bucket、再一起扣除，避免某個維度已扣、另一個維度卻拒絕。\u003c/p>\n\u003cp>\u003cstrong>Redis Cluster 的 slot 限制\u003c/strong>：一個 Lua script 只能操作同一個 slot 的 key。用 hash tag \u003ccode>{merchant:m42}\u003c/code> 讓同一商戶的各維度落在同一個 slot；domain、region 這類共用 key 分開呼叫，或改用本地近似計數。\u003c/p>\n\u003cp>\u003cstrong>熱點 key 的處理\u003c/strong>：大商戶或全域 region 的 key 會集中打到同一個 shard。常見做法是 local token lease（一次向 Redis 預取一批 token 在本地扣）、把 key 拆成 N 個子 bucket 各分 1/N 額度，或對共用維度改用本地近似限流再定期同步。代價是可能短暫超限，誤差必須可觀測。\u003c/p>"},"globalmulti-region-與-quota-分配":{"heading":"Global：Multi-region 與 Quota 分配","html":"\u003cp>\u003cstrong>Per-region 與 global limit 是不同語意\u003c/strong>：各 region 使用本地 Redis 延遲最低、故障隔離最好，但同一 client 跨區請求會放大全域額度。先決定可接受多少 over-admission、跨區延遲與單點風險。\u003c/p>\n\u003cp>\u003cstrong>三種協調強度對應不同 endpoint 風險\u003c/strong>：per-region limit 適合可容忍誤差；強一致 global counter 適合低 QPS、高價值且不能超限的操作；quota allocation 由中央控制面發 regional leases、在本地快速判定，是常見折衷。\u003c/p>\n\u003cp>\u003cstrong>熱路徑保持本地，誤差必須可量化\u003c/strong>：一般 API 平台採 regional Token Bucket 加 centrally allocated quota。資料面維持低延遲，控制面管理公平性、quota 補貨與 rule propagation，並讓 lease 誤差可觀測。\u003c/p>"},"failure-handling-與-observability":{"heading":"Failure Handling 與 Observability","html":"\u003cp>\u003cstrong>Failure policy 依 endpoint 風險選擇\u003c/strong>：Redis、config service 或 quota control plane 失敗時，高風險、付費或易 abuse 的 endpoint 採 fail closed；低風險讀取可短暫 fail open；也可退回保守的 local static limit。Redis 呼叫設 5–10ms timeout 加 circuit breaker：滑動時間窗內錯誤率超過門檻就切到本地 1/N 額度，half-open 時放少量請求探測恢復。\u003c/p>\n\u003cp>\u003cstrong>Client contract 必須避免 retry storm\u003c/strong>：超限回 \u003ccode>429\u003c/code>，附 \u003ccode>Retry-After\u003c/code>、remaining quota、limit 與 reset time，讓 client 使用 backoff 加 jitter。\u003c/p>\n\u003cp>\u003cstrong>觀測同時證明保護與公平\u003c/strong>：量測 allow／reject rate、decision latency、error rate、bucket remaining、quota lease、over-admission、config propagation、top rejected clients 與熱點 endpoint。每個 global 誤差都要可量化與可觀測。\u003c/p>"}}}}}</script></main></body></html><script type="module" src="/growth-site/_astro/index.astro_astro_type_script_index_0_lang.FDOFUjU6.js"></script>
